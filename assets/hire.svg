</linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/>
</pattern>
</defs>
<rect width="640" height="336" fill="#0a0a0f"/>

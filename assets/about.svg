<text x="40" y="40" font-size="13" fill="#8a86a3" letter-spacing="3">// about</text>
<text x="40" y="84" font-size="18" fill="#e7e5f2">I'm a computer engineering student who learns by</text>
<text x="40" y="112" font-size="18" fill="#e7e5f2">building. My work spans AI systems, backend</text>

<svg xmlns="http://www.w3.org/2000/svg" width="832" height="72" viewBox="0 0 832 72" role="img" aria-label="Section 2: Stack" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title>Section 2: Stack</title>
<defs>
<linearGradient id="gWord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<linearGradient id="gPulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399" stop-opacity=".9"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/></pattern>
<style>
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(840px)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(420px)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bars{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes flip{0%,45%{opacity:.25}55%,100%{opacity:1}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.spin{animation:spin 6s linear infinite;transform-box:view-box}
.float{animation:float 5s ease-in-out infinite}
.sweep{animation:sweep 5s linear infinite}
.scan{animation:scan 8s linear infinite}
.tag{animation:type 2.2s steps(31,end) .5s both}
.rise{animation:rise .8s ease-out both}
.bar{transform-box:fill-box;transform-origin:center;animation:bars 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g transform="translate(0 16)">
<path d="M48.2 38.5 L30.0 49.0 L11.8 38.5 L11.8 17.5 L30.0 7.0 L48.2 17.5 Z" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="30" y="34" font-size="15" font-weight="700" fill="#c4b5fd" text-anchor="middle">02</text>
<text x="64" y="35" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#e7e5f2" letter-spacing="4">STACK</text>
<path d="M752.6 27.2 L747.0 30.5 L741.4 27.2 L741.4 20.8 L747.0 17.5 L752.6 20.7 Z" fill="#8b5cf6" fill-opacity="0.35" stroke="#8b5cf6" stroke-opacity="0.9" stroke-width="1.2"/>
<path d="M769.6 27.2 L764.0 30.5 L758.4 27.2 L758.4 20.8 L764.0 17.5 L769.6 20.7 Z" fill="#8b5cf6" fill-opacity="1" stroke="#8b5cf6" stroke-opacity="0.9" stroke-width="1.2"/>
<path d="M786.6 27.2 L781.0 30.5 L775.4 27.2 L775.4 20.8 L781.0 17.5 L786.6 20.7 Z" fill="none" fill-opacity="0.35" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2"/>
<path d="M803.6 27.2 L798.0 30.5 L792.4 27.2 L792.4 20.8 L798.0 17.5 L803.6 20.7 Z" fill="none" fill-opacity="0.35" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2"/>
<path d="M820.6 27.2 L815.0 30.5 L809.4 27.2 L809.4 20.8 L815.0 17.5 L820.6 20.7 Z" fill="none" fill-opacity="0.35" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="725" y="29" font-size="13" fill="#8a86a3" text-anchor="end">six areas, no duplicates</text>
<rect x="0" y="51" width="832" height="1.5" fill="url(#gFade)"/>
<rect class="sweep" x="0" y="50.5" width="110" height="2.5" fill="url(#gPulse)"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="408" height="500" viewBox="0 0 408 500" role="img" aria-label="About: I'm a computer engineering student who learns by building. My work spans AI projects, backend services, security tooling and Discord platforms. I'd rather understand how something works than only call it." font-family="'JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title>About: I'm a computer engineering student who learns by building. My work spans AI projects, backend services, security tooling and Discord platforms. I'd rather understand how something works than only call it.</title>
<defs>
<linearGradient id="gWord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<linearGradient id="gPulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399" stop-opacity=".9"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/></pattern>
<style>
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(840px)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(420px)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bars{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes flip{0%,45%{opacity:.25}55%,100%{opacity:1}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.spin{animation:spin 6s linear infinite;transform-box:view-box}
.float{animation:float 5s ease-in-out infinite}
.sweep{animation:sweep 5s linear infinite}
.scan{animation:scan 8s linear infinite}
.tag{animation:type 2.2s steps(31,end) .5s both}
.rise{animation:rise .8s ease-out both}
.bar{transform-box:fill-box;transform-origin:center;animation:bars 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="408" height="500" fill="#0a0a0f"/>
<rect x=".5" y=".5" width="407" height="499" rx="8" fill="#100f18" stroke="#2a2144"/>
<rect x="0" y="8" width="3" height="484" fill="#8b5cf6"/>
<text x="28" y="36" font-size="13" fill="#8a86a3" letter-spacing="3">// about</text>
<text x="28" y="80" font-size="17" fill="#e7e5f2">I'm a computer engineering</text>
<text x="28" y="109" font-size="17" fill="#e7e5f2">student who learns by building.</text>
<text x="28" y="138" font-size="17" fill="#e7e5f2">My work spans AI projects,</text>
<text x="28" y="167" font-size="17" fill="#e7e5f2">backend services, security</text>
<text x="28" y="196" font-size="17" fill="#e7e5f2">tooling and Discord platforms.</text>
<text x="28" y="225" font-size="17" fill="#e7e5f2">I'd rather understand how</text>
<text x="28" y="254" font-size="17" fill="#e7e5f2">something works than only call</text>
<text x="28" y="283" font-size="17" fill="#e7e5f2">it.</text>
<rect x="28" y="316" width="352" height="1" fill="#2a2144"/>
<text x="28" y="344" font-size="14" xml:space="preserve"><tspan fill="#34d399">&gt;</tspan><tspan fill="#9b8fd0"> name   </tspan><tspan fill="#e7e5f2">SHARUU!</tspan></text>
<text x="28" y="366" font-size="14" xml:space="preserve"><tspan fill="#34d399">&gt;</tspan><tspan fill="#9b8fd0"> github </tspan><tspan fill="#e7e5f2">SHARUU-dev</tspan></text>
<text x="28" y="388" font-size="14" xml:space="preserve"><tspan fill="#34d399">&gt;</tspan><tspan fill="#9b8fd0"> field  </tspan><tspan fill="#e7e5f2">Computer Engineering</tspan></text>
<text x="28" y="410" font-size="14" xml:space="preserve"><tspan fill="#34d399">&gt;</tspan><tspan fill="#9b8fd0"> focus  </tspan><tspan fill="#e7e5f2">Backend · AI apps · Automation</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336" role="img" aria-label="Services: Discord bots from 1,500 rupees, web pages from 1,500, Python automation from 500, bug fixes from 300" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace">

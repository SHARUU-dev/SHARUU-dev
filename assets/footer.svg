<svg xmlns="http://www.w3.org/2000/svg" width="832" height="84" viewBox="0 0 832 84" role="img" aria-label="idea, code, error, debug, learn, build, repeat. SHARUU! Building ideas into technology." font-family="'JetBrains Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title>idea, code, error, debug, learn, build, repeat. SHARUU! Building ideas into technology.</title>
<defs>
<linearGradient id="gWord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<linearGradient id="gPulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399" stop-opacity=".9"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/></pattern>
<style>
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(840px)}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(420px)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bars{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes flip{0%,45%{opacity:.25}55%,100%{opacity:1}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.spin{animation:spin 6s linear infinite;transform-box:view-box}
.float{animation:float 5s ease-in-out infinite}
.sweep{animation:sweep 5s linear infinite}
.scan{animation:scan 8s linear infinite}
.tag{animation:type 2.2s steps(31,end) .5s both}
.rise{animation:rise .8s ease-out both}
.bar{transform-box:fill-box;transform-origin:center;animation:bars 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect width="832" height="84" fill="#0a0a0f"/>
<defs><clipPath id="sw"><rect class="sweep" x="0" y="0" width="140" height="84"/></clipPath></defs>
<path d="M40.4 40.0 L30.0 46.0 L19.6 40.0 L19.6 28.0 L30.0 22.0 L40.4 28.0 Z" fill="none" stroke="#8b5cf6" stroke-opacity=".6" stroke-width="1.4"/>
<path d="M812.4 40.0 L802.0 46.0 L791.6 40.0 L791.6 28.0 L802.0 22.0 L812.4 28.0 Z" fill="none" stroke="#8b5cf6" stroke-opacity=".6" stroke-width="1.4"/>
<rect x="56" y="33.5" width="40" height="1" fill="#2a2144"/><rect x="736" y="33.5" width="40" height="1" fill="#2a2144"/>
<text x="416.0" y="40" font-size="17" letter-spacing="1" text-anchor="middle" fill="#8a86a3">idea → code → error → debug → learn → build → repeat</text>
<g clip-path="url(#sw)"><text x="416.0" y="40" font-size="17" letter-spacing="1" text-anchor="middle" fill="#c4b5fd">idea → code → error → debug → learn → build → repeat</text></g>
<text x="416.0" y="68" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8a86a3" text-anchor="middle" letter-spacing="2">SHARUU! · BUILDING IDEAS INTO TECHNOLOGY</text>
</svg>

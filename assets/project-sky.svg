s" x="278.0" y="105.0" width="4" height="18" rx="2" fill="#c4b5fd" fill-opacity=".7"/><rect class="bar" style="animation-delay:0.30s" x="286.0" y="101.0" width="4" height="26" rx="2" fill="#c4b5fd" fill-opacity=".7"/><rect class="bar" style="animation-delay:0.45s" x="294.0" y="105.0" width="4" height="18" rx="2" fill="#c4b5fd" fill-opacity=".7"/><rect class="bar" style="animation-delay:0.60s" x="302.0" y="109.0" width="4" height="10" rx="2" fill="#c4b5fd" fill-opacity=".7"/></g></g>

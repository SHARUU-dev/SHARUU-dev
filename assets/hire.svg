  <stop offset="0" stop-color="#ede9fe"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
</linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0">
